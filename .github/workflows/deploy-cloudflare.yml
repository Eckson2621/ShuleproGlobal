name: Deploy ShulePro to Cloudflare Workers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare the complete static application
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/icons
          cp index.html modules.js manifest.webmanifest sw.js pwa-install.js _headers _redirects dist/
          cp icons/icon.svg icons/logo.svg dist/icons/
          test -s dist/index.html
          test -s dist/modules.js
          test -s dist/manifest.webmanifest
          test -s dist/sw.js
          test -s dist/pwa-install.js

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy

name: ShulePro preview validation

on:
  push:
    branches:
      - fix/guard-invalid-school-id-20261127
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run school-context tests
        run: node --test school-id-guard.test.mjs
      - name: Check JavaScript syntax
        run: |
          node --check modules.js
          node --check pwa-install.js
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [];
          let rest = html;
          while (true) {
            const open = rest.toLowerCase().indexOf('<script');
            if (open < 0) break;
            const openEnd = rest.indexOf('>', open);
            const close = rest.toLowerCase().indexOf('</script>', openEnd + 1);
            if (openEnd < 0 || close < 0) break;
            const attributes = rest.slice(open + 7, openEnd).toLowerCase();
            const code = rest.slice(openEnd + 1, close);
            if (!attributes.includes('src=') && !attributes.includes('application/json') && code.trim()) scripts.push(code);
            rest = rest.slice(close + 9);
          }
          if (!scripts.length) throw new Error('No inline JavaScript found');
          scripts.forEach((code, index) => fs.writeFileSync('/tmp/shulepro-inline-' + index + '.js', code));
          NODE
          for file in /tmp/shulepro-inline-*.js; do node --check "$file"; done
